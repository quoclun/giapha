<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cây Gia Phả - Dòng Họ Nguyễn</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .family-tree {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            min-height: 500px;
        }

        .tree-container {
            width: 100%;
            height: 600px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            background: #f9f9f9;
            overflow: auto;
        }

        .member-card {
            background: #fff;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            padding: 15px;
            margin: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-width: 150px;
        }

        .member-card.generation-1 { border-color: #e74c3c; background: #ffeaa7; }
        .member-card.generation-2 { border-color: #3498db; background: #dfe6e9; }
        .member-card.generation-3 { border-color: #9b59b6; background: #fd79a8; color: white; }

        .member-name {
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .member-info {
            font-size: 12px;
            color: #666;
        }

        .tree-lines {
            stroke: #7f8c8d;
            stroke-width: 2px;
        }

        footer {
            text-align: center;
            color: white;
            margin-top: 30px;
            opacity: 0.8;
        }

        .controls {
            text-align: center;
            margin: 20px 0;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 0 10px;
            font-size: 16px;
        }

        button:hover {
            background: #45a049;
        }
    </style>
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌳 CÂY GIA PHẢ DÒNG HỌ NGUYỄN</h1>
            <p>Lưu giữ và phát huy truyền thống gia đình</p>
        </header>

        <div class="controls">
            <button onclick="zoomIn()">Phóng to</button>
            <button onclick="zoomOut()">Thu nhỏ</button>
            <button onclick="resetView()">Mặc định</button>
        </div>

        <div class="family-tree">
            <div class="tree-container" id="tree"></div>
        </div>

        <footer>
            <p>© 2024 Gia Phả Family Tree - Kết nối mọi thế hệ</p>
        </footer>
    </div>

    <script>
        class FamilyTree {
            constructor(containerId) {
                this.containerId = containerId;
                this.margin = { top: 50, right: 120, bottom: 50, left: 120 };
                this.width = 1000 - this.margin.right - this.margin.left;
                this.height = 500 - this.margin.top - this.margin.bottom;
                this.zoom = d3.zoom().scaleExtent([0.1, 2]).on('zoom', (event) => {
                    this.svgGroup.attr('transform', event.transform);
                });
                this.init();
            }

            init() {
                // Tạo SVG container
                this.svg = d3.select(`#${this.containerId}`)
                    .append('svg')
                    .attr('width', '100%')
                    .attr('height', '100%')
                    .call(this.zoom);

                this.svgGroup = this.svg.append('g')
                    .attr('transform', `translate(${this.margin.left},${this.margin.top})`);

                this.treeLayout = d3.tree().size([this.height, this.width]);
            }

            async loadData() {
                try {
                    const response = await fetch('/api/tree');
                    const treeData = await response.json();
                    this.render(treeData);
                } catch (error) {
                    console.error('Lỗi tải dữ liệu:', error);
                    this.renderSampleData();
                }
            }

            render(treeData) {
                // Xóa nội dung cũ
                this.svgGroup.selectAll('*').remove();

                const root = d3.hierarchy(treeData);
                const treeDataLayout = this.treeLayout(root);

                // Vẽ đường kết nối
                this.svgGroup.selectAll('.link')
                    .data(treeDataLayout.links())
                    .enter().append('path')
                    .attr('class', 'tree-lines')
                    .attr('d', d3.linkHorizontal()
                        .x(d => d.y)
                        .y(d => d.x));

                // Tạo nodes
                const node = this.svgGroup.selectAll('.node')
                    .data(treeDataLayout.descendants())
                    .enter().append('g')
                    .attr('class', d => `node generation-${d.data.generation}`)
                    .attr('transform', d => `translate(${d.y},${d.x})`);

                // Vẽ hình chữ nhật cho node
                node.append('rect')
                    .attr('width', 140)
                    .attr('height', 60)
                    .attr('x', -70)
                    .attr('y', -30)
                    .attr('rx', 10)
                    .attr('ry', 10)
                    .style('fill', d => this.getGenerationColor(d.data.generation))
                    .style('stroke', '#2c3e50')
                    .style('stroke-width', 2);

                // Thêm tên
                node.append('text')
                    .attr('dy', -5)
                    .attr('text-anchor', 'middle')
                    .text(d => d.data.name)
                    .style('fill', 'white')
                    .style('font-weight', 'bold')
                    .style('font-size', '12px');

                // Thêm năm sinh
                node.append('text')
                    .attr('dy', 10)
                    .attr('text-anchor', 'middle')
                    .text(d => `Sinh: ${d.data.birthYear}`)
                    .style('fill', 'white')
                    .style('font-size', '10px');

                // Thêm thế hệ
                node.append('text')
                    .attr('dy', 25)
                    .attr('text-anchor', 'middle')
                    .text(d => `Thế hệ ${d.data.generation}`)
                    .style('fill', 'white')
                    .style('font-size', '10px');
            }

            getGenerationColor(generation) {
                const colors = {
                    1: '#e74c3c', // Đỏ - Ông bà
                    2: '#3498db', // Xanh - Cha mẹ
                    3: '#9b59b6', // Tím - Con cái
                    4: '#2ecc71', // Xanh lá - Cháu
                    5: '#f39c12'  // Cam - Chắt
                };
                return colors[generation] || '#95a5a6';
            }

            renderSampleData() {
                const sampleData = {
                    "id": 1,
                    "name": "Nguyễn Văn A",
                    "birthYear": "1950",
                    "generation": 1,
                    "children": [
                        {
                            "id": 2,
                            "name": "Nguyễn Văn B",
                            "birthYear": "1975",
                            "generation": 2
                        }
                    ]
                };
                this.render(sampleData);
            }
        }

        // Khởi tạo và tải cây gia phả
        const familyTree = new FamilyTree('tree');
        familyTree.loadData();

        // Chức năng zoom
        function zoomIn() {
            d3.select('svg').transition().call(d3.zoom().scaleBy, 1.3);
        }

        function zoomOut() {
            d3.select('svg').transition().call(d3.zoom().scaleBy, 0.7);
        }

        function resetView() {
            d3.select('svg').transition().call(d3.zoom().transform, d3.zoomIdentity);
        }
    </script>
</body>
</html>
