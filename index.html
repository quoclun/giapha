<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cây Gia Phả - Dòng Họ Nguyễn</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        header h1 {
            font-size: 2.8em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.3em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            margin-bottom: 30px;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .tree-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .info-section {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .section-title {
            color: #4a5568;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #e2e8f0;
            font-size: 1.5em;
        }

        #tree {
            width: 100%;
            height: 600px;
            border: 2px dashed #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
        }

        .member-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .member-card h3 {
            margin-bottom: 10px;
            font-size: 1.3em;
        }

        .member-card p {
            margin: 5px 0;
            opacity: 0.9;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #6c757d;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        footer {
            text-align: center;
            color: white;
            padding: 20px 0;
            opacity: 0.8;
        }

        /* Tree styling */
        .node {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .node:hover {
            transform: scale(1.1);
            filter: brightness(1.1);
        }

        .node rect {
            rx: 10;
            ry: 10;
            stroke-width: 2;
        }

        .node text {
            fill: white;
            font-weight: bold;
            font-size: 11px;
            text-anchor: middle;
            pointer-events: none;
        }

        .link {
            fill: none;
            stroke: #94a3b8;
            stroke-width: 2px;
        }

        .generation-1 rect { fill: #e53e3e; stroke: #c53030; }
        .generation-2 rect { fill: #dd6b20; stroke: #c05621; }
        .generation-3 rect { fill: #38a169; stroke: #2f855a; }
        .generation-4 rect { fill: #319795; stroke: #2c7a7b; }
        .generation-5 rect { fill: #3182ce; stroke: #2b6cb0; }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌳 CÂY GIA PHẢ DÒNG HỌ</h1>
            <p>Kết nối và lưu giữ truyền thống gia đình</p>
        </header>

        <div class="controls">
            <button class="btn" onclick="zoomIn()">🔍 Phóng to</button>
            <button class="btn" onclick="zoomOut()">🔍 Thu nhỏ</button>
            <button class="btn" onclick="resetView()">🔄 Mặc định</button>
            <button class="btn btn-secondary" onclick="loadSampleData()">📊 Dữ liệu mẫu</button>
        </div>

        <div class="main-content">
            <div class="tree-section">
                <h2 class="section-title">Sơ đồ Gia Phả</h2>
                <div id="tree">
                    <div class="loading">Đang tải cây gia phả...</div>
                </div>
            </div>

            <div class="info-section">
                <h2 class="section-title">Thông tin Thành viên</h2>
                <div id="member-info">
                    <div class="member-card">
                        <h3>Chào mừng!</h3>
                        <p>Nhấp vào một thành viên trên cây gia phả để xem thông tin chi tiết.</p>
                    </div>
                </div>
                
                <h3 class="section-title">Danh sách Thành viên</h3>
                <div id="members-list"></div>
            </div>
        </div>

        <footer>
            <p>© 2024 Gia Phả System - Bảo tồn di sản gia đình Việt</p>
        </footer>
    </div>

    <script>
        class FamilyTree {
            constructor(containerId) {
                this.containerId = containerId;
                this.margin = { top: 50, right: 120, bottom: 50, left: 120 };
                this.width = 800;
                this.height = 500;
                this.zoom = d3.zoom().scaleExtent([0.1, 3]).on('zoom', (event) => {
                    this.svgGroup.attr('transform', event.transform);
                });
                this.init();
            }

            init() {
                const container = d3.select(`#${this.containerId}`);
                container.selectAll('*').remove();

                this.svg = container.append('svg')
                    .attr('width', '100%')
                    .attr('height', '100%')
                    .call(this.zoom);

                this.svgGroup = this.svg.append('g')
                    .attr('transform', `translate(${this.margin.left},${this.margin.top})`);

                this.treeLayout = d3.tree().size([this.height, this.width]);
            }

            async loadData() {
                try {
                    const response = await fetch('/api/tree');
                    if (!response.ok) throw new Error('API error');
                    const treeData = await response.json();
                    this.render(treeData);
                    this.loadMembersList();
                } catch (error) {
                    console.error('Lỗi tải dữ liệu:', error);
                    this.render(this.getSampleData());
                    this.loadSampleMembers();
                }
            }

            render(treeData) {
                this.svgGroup.selectAll('*').remove();

                const root = d3.hierarchy(treeData);
                const treeDataLayout = this.treeLayout(root);

                // Links
                this.svgGroup.selectAll('.link')
                    .data(treeDataLayout.links())
                    .enter().append('path')
                    .attr('class', 'link')
                    .attr('d', d3.linkHorizontal()
                        .x(d => d.y)
                        .y(d => d.x));

                // Nodes
                const node = this.svgGroup.selectAll('.node')
                    .data(treeDataLayout.descendants())
                    .enter().append('g')
                    .attr('class', d => `node generation-${d.data.generation}`)
                    .attr('transform', d => `translate(${d.y},${d.x})`);

                // Node rectangles
                node.append('rect')
                    .attr('width', 140)
                    .attr('height', 50)
                    .attr('x', -70)
                    .attr('y', -25)
                    .style('cursor', 'pointer');

                // Node text
                node.append('text')
                    .attr('dy', -5)
                    .attr('text-anchor', 'middle')
                    .text(d => d.data.name)
                    .style('font-size', '10px');

                node.append('text')
                    .attr('dy', 10)
                    .attr('text-anchor', 'middle')
                    .text(d => d.data.title)
                    .style('font-size', '8px')
                    .style('opacity', 0.9);

                // Click event
                node.on('click', (event, d) => {
                    this.showMemberInfo(d.data);
                });
            }

            showMemberInfo(member) {
                const infoDiv = document.getElementById('member-info');
                infoDiv.innerHTML = `
                    <div class="member-card">
                        <h3>${member.name}</h3>
                        <p><strong>Vai trò:</strong> ${member.title}</p>
                        <p><strong>Thế hệ:</strong> ${member.generation}</p>
                        <p><strong>ID:</strong> ${member.id}</p>
                    </div>
                `;
            }

            async loadMembersList() {
                try {
                    const response = await fetch('/api/members');
                    const members = await response.json();
                    this.renderMembersList(members);
                } catch (error) {
                    this.loadSampleMembers();
                }
            }

            renderMembersList(members) {
                const container = document.getElementById('members-list');
                container.innerHTML = members.map(member => `
                    <div class="member-card" style="background: linear-gradient(135deg, ${this.getMemberColor(member.generation)})">
                        <h4>${member.name}</h4>
                        <p>${member.position} • Thế hệ ${member.generation}</p>
                        <p>Năm sinh: ${member.birthYear}</p>
                    </div>
                `).join('');
            }

            getMemberColor(generation) {
                const colors = {
                    1: '#e53e3e, #c53030',
                    2: '#dd6b20, #c05621', 
                    3: '#38a169, #2f855a',
                    4: '#319795, #2c7a7b',
                    5: '#3182ce, #2b6cb0'
                };
                return colors[generation] || '#667eea, #764ba2';
            }

            getSampleData() {
                return {
                    "id": 1,
                    "name": "Nguyễn Văn A",
                    "title": "Thế hệ 1 - Ông Tổ",
                    "generation": 1,
                    "children": [
                        {
                            "id": 2,
                            "name": "Nguyễn Văn B",
                            "title": "Thế hệ 2 - Con trưởng",
                            "generation": 2,
                            "children": [
                                {
                                    "id": 3,
                                    "name": "Nguyễn Thị C",
                                    "title": "Thế hệ 3 - Cháu nội",
                                    "generation": 3
                                }
                            ]
                        }
                    ]
                };
            }

            loadSampleMembers() {
                const members = [
                    { id: 1, name: 'Nguyễn Văn A', generation: 1, birthYear: 1950, position: 'Ông Tổ' },
                    { id: 2, name: 'Nguyễn Văn B', generation: 2, birthYear: 1975, position: 'Con trưởng' },
                    { id: 3, name: 'Nguyễn Thị C', generation: 3, birthYear: 2000, position: 'Cháu nội' }
                ];
                this.renderMembersList(members);
            }
        }

        // Initialize
        const familyTree = new FamilyTree('tree');

        // Load data when page loads
        document.addEventListener('DOMContentLoaded', () => {
            familyTree.loadData();
        });

        // Zoom functions
        function zoomIn() {
            d3.select('svg').transition().call(familyTree.zoom.scaleBy, 1.3);
        }

        function zoomOut() {
            d3.select('svg').transition().call(familyTree.zoom.scaleBy, 0.7);
        }

        function resetView() {
            d3.select('svg').transition().call(familyTree.zoom.transform, d3.zoomIdentity);
        }

        function loadSampleData() {
            familyTree.render(familyTree.getSampleData());
            familyTree.loadSampleMembers();
        }
    </script>
</body>
</html>
